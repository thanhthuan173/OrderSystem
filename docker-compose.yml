services:
  pulsar:
    image: apachepulsar/pulsar:3.2.1
    restart: unless-stopped
    command:
      - /bin/bash
      - -c
      - bin/pulsar standalone --advertised-address pulsar

    ports:
      - "6650:6650"
      - "8080:8080"

    volumes:
      - pulsar-data:/pulsar/data

    healthcheck:
      test: ["CMD", "bin/pulsar-admin", "brokers", "healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

    networks:
      - orderflow-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro

    ports:
      - "5432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d postgres"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - orderflow-net

  orders:
  build:
    context: .
    dockerfile: src/Orders/Dockerfile

  restart: unless-stopped

  environment:
    ASPNETCORE_ENVIRONMENT: Production
    ASPNETCORE_HTTP_PORTS: 8080

    ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=orderflow_orders;Username=postgres;Password=postgres"

    PULSAR_SERVICE_URL: "pulsar://pulsar:6650"

  depends_on:
    postgres:
      condition: service_healthy

    pulsar:
      condition: service_healthy

  ports:
    - "5001:8080"

  networks:
    - orderflow-net

  inventory:
  build:
    context: .
    dockerfile: src/Inventory/Dockerfile

  restart: unless-stopped

  environment:
    ASPNETCORE_ENVIRONMENT: Production
    ASPNETCORE_HTTP_PORTS: 8080

    ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=orderflow_inventory;Username=postgres;Password=postgres"

    PULSAR_SERVICE_URL: "pulsar://pulsar:6650"

  depends_on:
    postgres:
      condition: service_healthy

    pulsar:
      condition: service_healthy

  ports:
    - "5002:8080"

  networks:
    - orderflow-net

  payments:
  build:
    context: .
    dockerfile: src/Payments/Dockerfile

  restart: unless-stopped

  environment:
    ASPNETCORE_ENVIRONMENT: Production
    ASPNETCORE_HTTP_PORTS: 8080

    ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=orderflow_payments;Username=postgres;Password=postgres"

    PULSAR_SERVICE_URL: "pulsar://pulsar:6650"

  depends_on:
    postgres:
      condition: service_healthy

    pulsar:
      condition: service_healthy

  ports:
    - "5003:8080"

  networks:
    - orderflow-net

  client:
    build:
      context: .
      dockerfile: client/Dockerfile

    restart: unless-stopped

    depends_on:
      - orders
      - inventory
      - payments

    ports:
      - "5000:80"

    networks:
      - orderflow-net

  volumes:
    pulsar-data:
    postgres-data:

  networks:
    orderflow-net:
      driver: bridge